# Casos con agua e isobutano de Çengel y Boles, cap. 10 (ciclos de potencia de vapor).
id: cengel_cap10
cita: >-
  Çengel, Y. A., y Boles, M. A. Termodinámica. Cap. 10, Ciclos de potencia de vapor y combinados
  (edición en español). PDF del usuario: Papers/CICLOS_DE_POTENCIA_DE_VAPOR_Y_COMBINADOS.pdf
tipo: prueba de unidad (agua, tablas redondeadas) y orden de magnitud (isobutano)
paginas: numeración impresa del libro

casos:
  ej_10_1:
    ref: "Ej. 10-1, p. 564"
    datos: {P_ev_kPa: 3000, T3_degC: 350, P_cd_kPa: 75, estado_1: líquido saturado, eta_t: 1, eta_p: 1, origen: declarado}
    resultados: {w_b: 3.03, q_ent: 2728.6, q_sal: 2018.6, x4: 0.886, eta: 0.260}
    nota: ya probado en tests/test_cengel.py (con el Ej. 10-7, T_H = 800 K y T0 = 300 K)
  ej_10_2:
    ref: "Ej. 10-2, Fig. 10-5, pp. 567-568"
    datos:
      bomba: {P_entrada_kPa: 9, T_entrada_degC: 38, P_salida_kPa: 16000, eta_p: 0.85, origen: declarado}
      turbina: {P_entrada_kPa: 15000, T_entrada_degC: 600, P_salida_kPa: 10, eta_t: 0.87, origen: declarado}
      m: {valor: 15, unidad: kg/s}
    resultados: {w_bomba: 19.0, w_turbina: 1277.0, q_entrada: 3487.5, w_neto: 1258.0, eta: 0.361, W_neto_MW: 18.9}
    nota: >-
      Tiene caídas de presión (16 → 15 MPa en la caldera, 10 → 9 kPa en el condensador). El modelo
      supone ΔP = 0 (H3), así que no se reproduce como ciclo: solo se verifican la bomba y la
      turbina por separado (nivel V1). El libro calcula la bomba con v·ΔP/η.
  prob_10_29:
    ref: "Prob. 10-29 (con los datos del 10-27), p. 600"
    datos:
      isobutano: {P_entrada_turbina_kPa: 3250, T_entrada_turbina_degC: 145, P_salida_turbina_kPa: 400, T_salida_turbina_degC: 80, eta_p: 0.90, origen: declarado}
      estado_1: {valor: líquido saturado a 400 kPa, origen: supuesto, nota: el enunciado no lo dice}
      fuente: {pozo_kg_s: 230, pozo: líquido saturado a 230 °C, P_flash_kPa: 500, T_salida_agua_degC: 90, origen: "declarado (10-27 y 10-29)"}
      sumidero: {valor: aire, T_degC: 25, origen: supuesto, nota: condensador enfriado por aire sin T declarada; no cambia η ni Ẇ}
    resultados: {m_isobutano: 105.5, W_neto_binario_MW: 6.14, eta_binario: 0.122}
    nota: respuestas finales del libro (sin solución desarrollada); η_t se deriva de T4 = 80 °C

# Bloque que lee scripts/comparar_verificacion.py. Tolerancias V-D, §7 del plan (Çengel:
# ±0,5 % en calores y trabajos, ±0,2 pp en η).
verificacion:
  - id_punto: VP-01
    fluido: Water
    T_fuente_degC: 526.85          # T_H = 800 K del Ej. 10-7
    T_sumidero_degC: 26.85         # T0 = 300 K del Ej. 10-7
    P_ev: {kPa: 3000}
    P_cd: {kPa: 75}
    estado_3: {T_degC: 350}
    estado_1: {q: 0}
    eta_t: 1.0
    eta_p: 1.0
    m: {kg_s: 1}
    comparar:
      - {variable: eta, valor_ref: 0.260, unidad: "-", tolerancia: 0.002, tipo: abs, referencia: "Çengel Ej. 10-1, p. 564"}
      - {variable: Qin, valor_ref: 2728.6, unidad: kW, tolerancia: 0.005, tipo: rel, referencia: "Çengel Ej. 10-1, p. 564 (por kg/s)"}
      - {variable: Qout, valor_ref: 2018.6, unidad: kW, tolerancia: 0.005, tipo: rel, referencia: "Çengel Ej. 10-1, p. 564 (por kg/s)"}
      - {variable: Wp, valor_ref: 3.03, unidad: kW, tolerancia: 0.005, tipo: rel, referencia: "Çengel Ej. 10-1, p. 564 (por kg/s)"}
  - id_punto: VP-02
    tipo: componentes
    fluido: Water
    bomba: {P_entrada_kPa: 9, T_entrada_degC: 38, P_salida_kPa: 16000, eta_p: 0.85}
    turbina: {P_entrada_kPa: 15000, T_entrada_degC: 600, P_salida_kPa: 10, eta_t: 0.87}
    comparar:
      - {variable: w_bomba, valor_ref: 19.0, unidad: kJ/kg, tolerancia: 0.005, tipo: rel, referencia: "Çengel Ej. 10-2, p. 567", causa: "método: el libro usa v·ΔP/η (Ec. 10-3, v = 0,001009 de tablas) y da 18,95 ≈ 19,0; el código usa h(P2, s1), que incluye la compresibilidad del líquido (18,88). Causa hallada tras la primera corrida, 2026-11-01"}
      - {variable: w_turbina, valor_ref: 1277.0, unidad: kJ/kg, tolerancia: 0.005, tipo: rel, referencia: "Çengel Ej. 10-2, p. 568"}
  - id_punto: VP-05
    fluido: IsoButane
    T_fuente_degC: 151.83          # T_sat del agua a 500 kPa (separador); no cambia η ni Ẇ
    T_sumidero_degC: 25
    P_ev: {kPa: 3250}
    P_cd: {kPa: 400}
    estado_3: {T_degC: 145}
    estado_1: {q: 0}
    eta_t: {desde_T4_degC: 80}
    eta_p: 0.90
    m: {flash: {m_pozo: 230, T_pozo_degC: 230, P_flash_kPa: 500, T_salida_degC: 90}}
    comparar:
      - {variable: m, valor_ref: 105.5, unidad: kg/s, tolerancia: 0.005, tipo: rel, referencia: "Çengel Prob. 10-29, p. 600"}
      - {variable: Wnet, valor_ref: 6140, unidad: kW, tolerancia: 0.005, tipo: rel, referencia: "Çengel Prob. 10-29, p. 600", causa: "EoS del isobutano que usó el libro (EES de su edición). Los estados 3 (3,25 MPa; 145 °C) y 4 (400 kPa; 80 °C) los fija el enunciado, así que w_t = h3 − h4 solo depende de las propiedades: libro 63,9–64,1 kJ/kg (de 6,14 MW y 105,5 kg/s), CoolProp 64,49, EES V10 64,41. Q_in del código (50,39 MW) cae dentro del rango del libro (50,1–50,6 MW). Causa hallada el 2026-11-02 en la revisión de advertencias"}
      - {variable: eta, valor_ref: 0.122, unidad: "-", tolerancia: 0.002, tipo: abs, referencia: "Çengel Prob. 10-29, p. 600"}
  # Problemas 10-23 y 10-21 (p. 599), agregados el 2026-11-02. Tolerancias fijadas antes de correr:
  # las del §7 (±0,5 % y ±0,2 pp) o media unidad de la última cifra publicada, la que sea mayor.
  # T_fuente y T_sumidero no los da el enunciado [supuesto]: solo fijan las ε equivalentes y no
  # cambian η ni Ẇ (el ciclo vuelve al estado del libro).
  - id_punto: VP-14
    fluido: Water
    T_fuente_degC: 526.85          # supuesto (como VP-01)
    T_sumidero_degC: 25            # supuesto
    P_ev: {kPa: 6000}
    P_cd: {kPa: 50}
    estado_3: {T_degC: 450}
    estado_1: {subenfriado_K: 6.3} # declarado: «subenfriada en 6.3 °C»
    eta_t: 0.94
    eta_p: 1.0                     # declarado: «pérdidas de bomba despreciables»
    m: {kg_s: 20}
    comparar:
      - {variable: Qin, valor_ref: 59660, unidad: kW, tolerancia: 0.005, tipo: rel, referencia: "Çengel Prob. 10-23, p. 599"}
      - {variable: Wp, valor_ref: 122, unidad: kW, tolerancia: 0.005, tipo: rel, referencia: "Çengel Prob. 10-23, p. 599"}
      - {variable: Wnet, valor_ref: 18050, unidad: kW, tolerancia: 0.005, tipo: rel, referencia: "Çengel Prob. 10-23, p. 599"}
      - {variable: eta, valor_ref: 0.303, unidad: "-", tolerancia: 0.002, tipo: abs, referencia: "Çengel Prob. 10-23, p. 599"}
  - id_punto: VP-15
    fluido: Water
    T_fuente_degC: 526.85          # supuesto
    T_sumidero_degC: 25            # supuesto
    P_ev: {kPa: 7000}
    P_cd: {kPa: 10}
    estado_3: {T_degC: 500}
    estado_1: {q: 0}               # ciclo ideal simple: líquido saturado
    eta_t: 1.0
    eta_p: 1.0
    m: {desde_W_net_kW: 45000}     # declarado: 45 MW netos
    enfriamiento: {m_kg_s: 2000, cp_kJ_kgK: 4.18}   # 2000 kg/s declarado; cp del agua del libro (Tabla A-3)
    comparar:
      - {variable: eta, valor_ref: 0.389, unidad: "-", tolerancia: 0.002, tipo: abs, referencia: "Çengel Prob. 10-21, p. 599"}
      - {variable: m, valor_ref: 36, unidad: kg/s, tolerancia: 0.014, tipo: rel, referencia: "Çengel Prob. 10-21, p. 599 (dos cifras: ±0,5 kg/s)"}
      - {variable: dT_enfriamiento, valor_ref: 8.4, unidad: K, tolerancia: 0.006, tipo: rel, referencia: "Çengel Prob. 10-21, p. 599 (±0,05 °C)"}
