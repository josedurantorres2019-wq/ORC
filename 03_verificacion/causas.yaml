# Causas documentadas de las diferencias Python ↔ herramienta fuera de tolerancia (regla del plan §7:
# fuera de tolerancia con causa = «explicado»; sin causa = «falla»). Cada causa dice cómo se comprobó.
# Se aplica a las filas fuera de tolerancia de esa herramienta y esos puntos; «todos» = todos los puntos.
# Revisado el 2026-11-02 con pruebas aisladas (scripts en el reporte, § Cómo se comprobó).
EES:
  todos: >-
    EoS de EES distinta de CoolProp. Prueba V0 (2026-11-01): con las mismas entradas, la diferencia
    de Q_in EES-Python es igual a la de Δh = h(P_ev,T_fuente) - h(P_cd,T_sumidero) calculada solo con
    propiedades (p. ej. R152a +0,41 % y +0,41 %; MM +0,40 % y +0,33 %; T_sat del MM -0,83 K).
    Los lazos de EES cierran (residuos < 1e-8).
DWSIM-CoolProp:
  todos: >-
    Falla del paquete CoolProp de DWSIM en estados saturados. Prueba aislada hecha toda dentro de
    DWSIM (2026-11-02, n-butano, 933 kPa): con vapor sobrecalentado DWSIM da la misma h que CoolProp,
    pero el vapor saturado (P, VF = 1) sale 3,2 kJ/kg corrido y la expansión isentrópica desde él da
    53,6 kJ/kg (CoolProp 37,2; DWSIM-PR 37,4). Los estados 1 y 3 de los papers son saturados.
    VP-05 y VP-01 (sin estados saturados a la entrada de la turbina) coinciden con Python.
DWSIM-PR:
  todos: >-
    EoS Peng-Robinson frente a CoolProp (sensibilidad a la EoS, tolerancia orientativa del §7).
  VP-06: &bomba_pr >-
    Falla del flash PH de DWSIM-PR a la salida de la bomba. Prueba aislada (2026-11-02, líquido
    0,5 K subenfriado a P_cd bombeado a P_ev): con R134a, MM y R1234yf T2 sale 298,15 K (el valor
    por defecto de DWSIM: el flash no converge) y con R152a w_p = 22,0 kJ/kg (CoolProp 1,8); con
    n-butano sale bien. Cambiar el algoritmo de flash (SingleCompFlash, NestedLoops) no lo corrige.
  VP-C-R134a: *bomba_pr
  VP-C-R152a: *bomba_pr
  VP-T7-R152a: *bomba_pr
