[pytest]
testpaths = tests
# Las pruebas que resuelven el ciclo con fluidos del estudio quedan fuera por defecto
# (memoria «no correr sin orden»). Se corren a pedido con:  pytest -m corrida
addopts = -m "not corrida"
markers =
    corrida: resuelve el ciclo ORC con un fluido del estudio; solo con orden del usuario
